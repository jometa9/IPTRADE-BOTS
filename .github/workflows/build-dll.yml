name: Build copybridge.dll

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      matrix:
        include:
          - arch: Win32
            platform: mt4
          - arch: x64
            platform: mt5
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S bridge-dll -B build-${{ matrix.arch }} -G "Visual Studio 17 2022" -A ${{ matrix.arch }}

      - name: Build
        run: cmake --build build-${{ matrix.arch }} --config Release

      - name: Stage output
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out/${{ matrix.platform }}/Libraries | Out-Null
          New-Item -ItemType Directory -Force -Path out/${{ matrix.platform }}/Include/bridge | Out-Null
          Copy-Item (Get-ChildItem -Recurse build-${{ matrix.arch }} -Filter copybridge.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1).FullName out/${{ matrix.platform }}/Libraries/copybridge.dll
          Copy-Item include/bridge/BridgeJson.mqh out/${{ matrix.platform }}/Include/bridge/BridgeJson.mqh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: copybridge-${{ matrix.platform }}-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  release:
    name: Attach DLLs to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Zip per platform
        run: |
          cd artifacts
          zip -r ../copybridge-mt4-win32.zip mt4
          zip -r ../copybridge-mt5-x64.zip mt5

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            copybridge-mt4-win32.zip
            copybridge-mt5-x64.zip
          generate_release_notes: true
